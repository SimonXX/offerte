# Raccolta continua su GitHub Actions e feed pubblicati su GitHub Pages. Costo zero su repository pubblico.
# La cadenza la detta .github/workflows/sveglia.yml; deploy/autoavvio.sh e' la ruota di scorta, spenta di default.
# Stato (SQLite) su un branch orfano "data" riscritto a ogni giro, così il repository non cresce.
name: offerte

on:
  schedule:
    # Rete di sicurezza, non il motore: se il ciclo di autoavvio si spegne, questa lo riaccende.
    # Minuti sfalsati dai tondi (:00, :15, :30, :45), i piu' congestionati sui runner gratuiti.
    - cron: "2,7,12,17,22,27,32,37,42,47,52,57 * * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths: [config.yaml, "regole/**", "src/**", pyproject.toml, uv.lock, ".github/workflows/offerte.yml", "deploy/**"]

permissions:
  contents: write
  pages: write
  id-token: write
  actions: write

concurrency:
  group: offerte
  cancel-in-progress: false

env:
  OFFERTE_FEED_BASE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}

jobs:
  raccolta:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --frozen --no-dev
      - name: Ripristina lo stato dal branch data
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./deploy/stato.sh restore
      - name: Raccolta
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
        run: uv run offerte fetch
      - name: Salva lo stato sul branch data
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./deploy/stato.sh save
      - uses: actions/upload-pages-artifact@v3
        with:
          path: var/feeds
      - name: Chiedi il giro successivo
        if: always()
        env:
          GH_TOKEN: ${{ secrets.AUTOAVVIO_TOKEN }}
          AUTOAVVIO: ${{ vars.AUTOAVVIO }}   # "on" accende il ciclo continuo; vuoto = cadenza da sveglia.yml
        run: ./deploy/autoavvio.sh

  pubblicazione:
    needs: raccolta
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
