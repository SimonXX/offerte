[project]
name = "offerte"
version = "0.2.0"
description = "Aggrega le offerte dei canali Telegram pubblici e produce feed RSS e JSON filtrati"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",
    "selectolax>=1.0",
    "pyyaml>=6.0",
    "feedgen>=1.0",
]

[project.scripts]
offerte = "offerte.cli:main"

[dependency-groups]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/offerte"]

[tool.pytest.ini_options]
testpaths = ["tests"]
